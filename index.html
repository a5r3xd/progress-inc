<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Inc</title>
    <style>
      :root {
        --bg: #000000;
        --text: #ffffff;
        --track: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        background: #000;
      }

      #app {
        width: min(92vw, 920px);
        padding: 18px 18px 18px;
      }

      #multiplier {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.15rem;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ffffff;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 999px;
        padding: 8px 16px;
        box-shadow: 0 0 12px rgba(255,255,255,0.12);
      }

      #progressStack {
        display: flex;
        flex-direction: column-reverse;
        justify-content: flex-start;
        align-items: stretch;
        gap: 10px;
        min-height: calc(100vh - 48px);
        padding-bottom: 18px;
      }

      .bar-card {
        width: 100%;
        opacity: 0.96;
      }

      .bar-label {
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .track {
        position: relative;
        width: 100%;
        height: 20px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      }

      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: inherit;
        transition: width 0.05s linear;
      }

      .glow {
        box-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 26px rgba(255,255,255,0.45);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="multiplier">x1</div>
      <div id="progressStack"></div>
    </div>

    <script>
      const stages = [
        { name: 'Priming', goal: 3, color: '#ff3b30', text: '#ffffff' },
        { name: 'Secondarying', goal: 4, color: '#ff8c1a', text: '#ffffff' },
        { name: 'Ternarying', goal: 5, color: '#ffd633', text: '#ffffff' },
        { name: 'Quaternarying', goal: 6, color: '#69da61', text: '#ffffff' },
        { name: 'Quinarying', goal: 7, color: '#45c8ff', text: '#ffffff' },
        { name: 'Senarying', goal: 8, color: '#7678ff', text: '#ffffff' },
        { name: 'Septenarying', goal: 9, color: '#ff70d2', text: '#ffffff' },
        { name: 'Octonarying', goal: 10, color: '#ff9a6d', text: '#ffffff' },
        { name: 'Nonarying', goal: 11, color: '#9ff5d4', text: '#ffffff' },
        { name: 'Prestiging', goal: 1, color: '#ffffff', text: '#000000', glow: true }
      ];

      const state = {
        values: Array(stages.length).fill(0),
        highestVisible: 0,
        currentStage: 0,
        stageProgress: 0,
        multiplier: 1,
        primingBoost: 1,
        timer: null
      };

      const stack = document.getElementById('progressStack');
      const multiplierLabel = document.getElementById('multiplier');

      function setMultiplierText() {
        multiplierLabel.textContent = `x${state.multiplier}`;
      }

      function getPrimingMultiplier() {
        const unlockedBoostStages = Math.max(0, state.highestVisible - 1);
        return state.multiplier * Math.pow(3, unlockedBoostStages);
      }

      function updateHighestVisible() {
        state.highestVisible = Math.max(state.highestVisible, state.currentStage);
        for (let i = 0; i <= state.highestVisible; i++) {
          if (state.values[i] > 0 || i === 0) {
            state.highestVisible = Math.max(state.highestVisible, i);
          }
        }
      }

      function buildBarCard(stage, count, percent) {
        const card = document.createElement('div');
        card.className = 'bar-card';

        const label = document.createElement('div');
        label.className = 'bar-label';
        label.textContent = `${stage.name}... (${count}/${stage.goal})`;
        label.style.color = stage.text;

        const track = document.createElement('div');
        track.className = 'track';

        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = `${Math.max(0, Math.min(100, percent))}%`;
        fill.style.background = stage.color;
        if (stage.glow) fill.classList.add('glow');

        track.appendChild(fill);
        card.appendChild(label);
        card.appendChild(track);
        return card;
      }

      function render() {
        stack.innerHTML = '';
        setMultiplierText();

        for (let i = 0; i <= state.highestVisible; i++) {
          const stage = stages[i];
          const count = state.values[i];
          const percent = i === 0 ? state.stageProgress * 100 : (count / stage.goal) * 100;
          stack.appendChild(buildBarCard(stage, count, percent));
        }
      }

      function propagateProgress(index) {
        if (index >= stages.length) {
          state.values = Array(stages.length).fill(0);
          state.currentStage = 0;
          state.highestVisible = 0;
          state.multiplier += 1;
          state.primingBoost = 1;
          state.stageProgress = 0;
          render();
          startStage();
          return;
        }

        state.values[index] += 1;
        state.highestVisible = Math.max(state.highestVisible, index);

        if (state.values[index] >= stages[index].goal) {
          state.values[index] = 0;
          if (index === stages.length - 1) {
            propagateProgress(index + 1);
            return;
          }
          propagateProgress(index + 1);
        }
      }

      function completePriming() {
        state.values[0] += 1;
        state.highestVisible = Math.max(state.highestVisible, 0);

        if (state.values[0] >= stages[0].goal) {
          state.values[0] = 0;
          propagateProgress(1);
        }

        state.stageProgress = 0;
        render();
        startStage();
      }

      function startStage() {
        if (state.timer) clearInterval(state.timer);

        const primingSpeed = 2000 / getPrimingMultiplier();

        state.timer = setInterval(() => {
          state.stageProgress += 50 / primingSpeed;

          if (state.stageProgress >= 1) {
            clearInterval(state.timer);
            state.timer = null;
            completePriming();
            return;
          }

          render();
        }, 50);
      }

      render();
      startStage();
    </script>
  </body>
</html>
